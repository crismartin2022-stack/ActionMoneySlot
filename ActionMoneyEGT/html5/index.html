<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ActionMoneySlot</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  </style>
</head>
<body>
  <script src="../js/jquery.js"></script>
  <script src="../init/init_desktop_cf_test.js"></script>
  <script>
    (function () {
      function getQueryParam(key, fallback) {
        var value = new URLSearchParams(window.location.search).get(key);
        return value === null || value === '' ? fallback : value;
      }

      var config = {
        sslHost: getQueryParam('sslHost', 'false') === 'true',
        tcpHost: getQueryParam('tcpHost', '127.0.0.1:3001'),
        game: getQueryParam('game', 'ActionMoneySlot'),
        language: getQueryParam('language', 'en'),
        currency: getQueryParam('currency', 'EUR'),
        token: getQueryParam('token', 'local-test-token')
      };

      initDesktopHtml(config);
    })();
  </script>
</body>
</html>
