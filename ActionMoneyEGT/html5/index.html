<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ActionMoneySlot</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
  <script src="./lib/jquery.min.js"></script>
  <script src="./gpts.min.js"></script>
  <script src="./device.min.js"></script>
  <script src="../init/init_desktop_cf_test.js"></script>
  <script>
    (function () {
      function showRuntimeError(message) {
        var errorBox = ensureRuntimeMessageBox('runtimeError', 12, 'rgba(140,0,0,0.95)');
        errorBox.textContent = '';
        errorBox.textContent = message;
      }

      function showRuntimeValidation(message, isWarning) {
        var validationBox = ensureRuntimeMessageBox('runtimeValidation', 92, isWarning ? 'rgba(120,80,0,0.95)' : 'rgba(0,90,0,0.95)');
        validationBox.textContent = '';
        validationBox.textContent = message;
      }

      function ensureRuntimeMessageBox(id, top, background) {
        var box = document.getElementById(id);
        if (!box) {
          box = document.createElement('div');
          box.id = id;
          box.setAttribute('role', id === 'runtimeError' ? 'alert' : 'status');
          box.setAttribute('aria-live', id === 'runtimeError' ? 'assertive' : 'polite');
          box.setAttribute('aria-atomic', 'true');
          box.style.position = 'fixed';
          box.style.top = top + 'px';
          box.style.left = '12px';
          box.style.right = '12px';
          box.style.zIndex = '99999';
          box.style.padding = '12px 14px';
          box.style.color = '#fff';
          box.style.fontFamily = 'Arial, sans-serif';
          box.style.fontSize = '14px';
          box.style.lineHeight = '1.4';
          box.style.border = '1px solid rgba(255,255,255,0.25)';
          box.style.borderRadius = '4px';
          document.body.appendChild(box);
        }
        box.style.background = background;
        return box;
      }

      function getQueryParam(name, fallback) {
        var value = gptsInit.getParameterBy(name);
        return value === null || value === '' ? fallback : value;
      }

      function getBooleanQueryParam(name, fallback) {
        var value = gptsInit.getParameterBy(name);
        if (value === null || value === '') return fallback;
        return value === 'true' || value === '1';
      }

      function normalizeSocketConfig(rawHost, rawPort, sslHost, hasExplicitPortParam) {
        var requestedProtocol = sslHost ? 'wss://' : 'ws://';
        var hostInput = String(rawHost || '').trim();
        var portInput = String(rawPort || '').trim();
        var hostWithScheme = hostInput;
        var hasExplicitScheme = /^[a-z][a-z0-9+.-]*:\/\//i.test(hostInput);
        var warnings = [];

        if (!hostInput) {
          return { error: 'tcpHost no puede estar vacío.' };
        }

        if (/^[a-z][a-z0-9+.-]*:/i.test(hostInput) && !/^[a-z][a-z0-9+.-]*:\/\//i.test(hostInput)) {
          return { error: 'tcpHost solo acepta host[:puerto] o URLs ws/wss. Valor recibido: ' + hostInput };
        }

        if (!hasExplicitScheme && isBareIpv6Host(hostInput)) {
          hostWithScheme = '[' + hostInput + ']';
        }

        if (hasExtraUrlParts(hostWithScheme)) {
          return { error: 'tcpHost debe contener solo host[:puerto], sin path ni query. Valor recibido: ' + hostInput };
        }

        if (!hasExplicitScheme) {
          hostWithScheme = requestedProtocol + hostWithScheme;
        }

        try {
          var parsedHost = new URL(hostWithScheme);
          if (hasExplicitScheme && parsedHost.protocol !== 'ws:' && parsedHost.protocol !== 'wss:') {
            return { error: 'tcpHost solo acepta host[:puerto] o URLs ws/wss. Valor recibido: ' + hostInput };
          }
          var effectiveSslHost = hasExplicitScheme ? parsedHost.protocol === 'wss:' : sslHost;
          var protocol = effectiveSslHost ? 'wss://' : 'ws://';
          var defaultPort = effectiveSslHost ? '443' : '80';
          var normalizedHost = parsedHost.hostname;
          var detectedPort = parsedHost.port;
          var normalizedPort = detectedPort || portInput || defaultPort;

          if (!normalizedHost) {
            return { error: 'tcpHost no contiene un host válido.' };
          }

          if (normalizedHost.indexOf(':') !== -1 && normalizedHost.charAt(0) !== '[') {
            normalizedHost = '[' + normalizedHost + ']';
          }

          if (!/^\d+$/.test(normalizedPort)) {
            return { error: 'tcpPort debe ser numérico. Valor recibido: ' + normalizedPort };
          }

          var portNumber = Number(normalizedPort);
          if (portNumber < 1 || portNumber > 65535) {
            return { error: 'tcpPort debe estar entre 1 y 65535. Valor recibido: ' + normalizedPort };
          }

          var includePortInEndpoint = String(portNumber) !== defaultPort;

          if (detectedPort) {
            if (hasExplicitPortParam && portInput && portInput !== detectedPort) {
              warnings.push('tcpHost ya incluye el puerto ' + detectedPort + '; se ignora tcpPort=' + portInput + '.');
            }
          }

          return {
            host: normalizedHost,
            port: String(portNumber),
            sslHost: effectiveSslHost,
            wsEndpoint: protocol + normalizedHost + (includePortInEndpoint ? ':' + portNumber : ''),
            warnings: warnings
          };
        } catch (error) {
          return { error: 'tcpHost no es válido: ' + hostInput };
        }
      }

      function hasExtraUrlParts(hostInput) {
        var value = String(hostInput || '').replace(/^[a-z][a-z0-9+.-]*:\/\//i, '');
        var match;

        if (isBareIpv6Host(value)) {
          return false;
        }

        if (value.charAt(0) === '[') {
          match = value.match(/^\[[^\]]+\](?::\d+)?(.*)$/);
          if (!match) {
            return false;
          }
        } else {
          match = value.match(/^[^/?#:]+(?::\d+)?(.*)$/);
          if (!match) {
            return true;
          }
        }

        return /^[/?#]/.test(match[1] || '');
      }

      function isBareIpv6Host(hostInput) {
        return typeof hostInput === 'string'
          && hostInput.indexOf('[') === -1
          && hostInput.indexOf(']') === -1
          && (hostInput.match(/:/g) || []).length >= 2
          && !/[/?#]/.test(hostInput);
      }

      function isBootstrapSocketUrl(url, expectedProtocol, expectedHost, expectedPort, expectedPath) {
        var isUrlObject = url && typeof url === 'object' && typeof url.href === 'string';
        if (typeof url !== 'string' && !isUrlObject) {
          return false;
        }

        var candidateUrl = isUrlObject ? url.href : url;
        if (!/^wss?:\/\//i.test(candidateUrl)) {
          return false;
        }
        try {
          var parsedUrl = new URL(candidateUrl);
          if (parsedUrl.protocol !== 'ws:' && parsedUrl.protocol !== 'wss:') {
            return false;
          }
          var effectivePort = parsedUrl.port || (parsedUrl.protocol === 'wss:' ? '443' : '80');
          return parsedUrl.protocol === expectedProtocol
            && normalizeHostname(parsedUrl.hostname) === normalizeHostname(expectedHost)
            && effectivePort === expectedPort
            && parsedUrl.pathname === expectedPath
            && !parsedUrl.search
            && !parsedUrl.hash;
        } catch (error) {
          return false;
        }
      }

      function normalizeHostname(hostname) {
        return String(hostname || '').replace(/^\[/, '').replace(/\]$/, '');
      }

      if (typeof gptsInit === 'undefined' || typeof initDesktopHtml !== 'function') {
        showRuntimeError('No se pudo inicializar el runtime: faltan scripts base del bootstrap.');
        return;
      }

      var sslHost = getBooleanQueryParam('sslHost', window.location.protocol === 'https:');
      var requestedSslHost = sslHost;
      var rawTcpHost = getQueryParam('tcpHost', window.location.hostname);
      var tcpPortParam = gptsInit.getParameterBy('tcpPort');
      var hasExplicitTcpPort = tcpPortParam !== null && tcpPortParam !== '';
      var rawTcpPort = hasExplicitTcpPort ? tcpPortParam : (sslHost ? '443' : '80');
      var socketConfig = normalizeSocketConfig(rawTcpHost, rawTcpPort, sslHost, hasExplicitTcpPort);
      var gameName = getQueryParam('gameName', getQueryParam('game', 'ActionMoneySlot'));
      if (socketConfig.error) {
        showRuntimeError(socketConfig.error);
        return;
      }
      sslHost = socketConfig.sslHost;
      var tcpHost = socketConfig.host;
      var tcpPort = socketConfig.port;
      var wsEndpoint = socketConfig.wsEndpoint;
      var hasOpenedSocket = false;

      window.gameName = gameName;
      console.info('[ActionMoneySlot] WebSocket endpoint:', wsEndpoint);
      showRuntimeValidation(
        'WebSocket normalizado: ' + wsEndpoint + (socketConfig.warnings.length ? ' — ' + socketConfig.warnings.join(' ') : ''),
        socketConfig.warnings.length > 0
      );
      if (socketConfig.warnings.length > 0) {
        console.warn('[ActionMoneySlot] WebSocket normalization:', socketConfig.warnings.join(' '));
      }

      window.addEventListener('error', function (event) {
        if (event && event.message) {
          showRuntimeError('Error de runtime: ' + event.message);
        }
      });

      window.addEventListener('unhandledrejection', function (event) {
        var reason = event && event.reason ? String(event.reason) : 'Promise rechazada sin detalle.';
        showRuntimeError('Error asíncrono de runtime: ' + reason);
      });

      if (typeof window.WebSocket === 'function') {
        var NativeWebSocket = window.WebSocket;
        window.WebSocket = function (url, protocols) {
          var resolvedUrl = (isBootstrapSocketUrl(url, requestedSslHost ? 'wss:' : 'ws:', tcpHost, tcpPort, '/')
            || isBootstrapSocketUrl(url, sslHost ? 'wss:' : 'ws:', tcpHost, tcpPort, '/'))
            ? wsEndpoint
            : url;
          var socket = protocols === undefined ? new NativeWebSocket(resolvedUrl) : new NativeWebSocket(resolvedUrl, protocols);
          socket.addEventListener('open', function () {
            hasOpenedSocket = true;
          });
          socket.addEventListener('error', function () {
            showRuntimeError('Falló la conexión WebSocket con ' + wsEndpoint + '. Revisa tcpHost/tcpPort/sslHost.');
          });
          socket.addEventListener('close', function () {
            if (!hasOpenedSocket) {
              showRuntimeError('No se pudo abrir WebSocket en ' + wsEndpoint + '.');
            }
          });
          return socket;
        };
        window.WebSocket.prototype = NativeWebSocket.prototype;
      }

      setTimeout(function () {
        if (!hasOpenedSocket) {
          showRuntimeError('La conexión WebSocket sigue sin abrirse después de 15s: ' + wsEndpoint);
        }
      }, 15000);

      try {
        initDesktopHtml({
          sslHost: sslHost,
          tcpHost: tcpHost,
          tcpPort: tcpPort,
          gameName: gameName,
          game: gameName,
          language: getQueryParam('language', 'en'),
          currency: getQueryParam('currency', 'EUR'),
          token: getQueryParam('token', 'local-test-token')
        });
      } catch (error) {
        showRuntimeError('Falló la inicialización: ' + (error && error.message ? error.message : String(error)));
      }
    })();
  </script>
</body>
</html>
