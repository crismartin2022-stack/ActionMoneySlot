<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ActionMoneySlot - EGT</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div id="game-container" aria-live="polite">
        <div id="loading" class="panel">
            <p class="eyebrow">ActionMoneySlot</p>
            <h1>Preparando el bootstrap del juego</h1>
            <p id="boot-message">
                Verificando dependencias, assets y runtime del bundle HTML5.
            </p>
            <div class="progress-bar" aria-hidden="true">
                <div class="progress-fill"></div>
            </div>
        </div>
    </div>

    <!-- 1. Librerías base (Pixi, GSAP, jQuery) -->
    <!-- Asumo que están en la carpeta 'lib' como ves en tu imagen -->
    <script src="lib/egm.min.js"></script> <!-- O gamy.min.js, verifica el nombre -->
    <script src="lib/gamy.min.js"></script> <!-- Asegúrate que gamy sea gamy o egm -->
    
    <!-- 2. Archivos de lógica del juego (scripts) -->
    <script src="scripts/Config.js"></script>
    <script src="scripts/BonusAnimation.min.js"></script>
    <script src="scripts/FreespinAnimation.min.js"></script>
    <script src="scripts/Game.min.js"></script> <!-- Asumiendo que es Game.min.js -->
    
    <!-- 3. Archivos de assets y configuración final -->
    <script src="Config.js"></script>
    <script src="main.js"></script>
</body>
</html>
