<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ActionMoneySlot - EGT</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div id="game-container" aria-live="polite">
        <div id="loading" class="panel">
            <p class="eyebrow">ActionMoneySlot</p>
            <h1>Preparando el bootstrap del juego</h1>
            <p id="boot-message">
                Verificando dependencias, assets y runtime del bundle HTML5.
            </p>
            <div class="progress-bar" aria-hidden="true">
                <div class="progress-fill"></div>
            </div>
        </div>
    </div>

    <!-- 1. Carga las librerías base (Pixi, jQuery, etc.) -->
    <script src="lib/pixi.min.js"></script>
    <script src="lib/jquery.min.js"></script>
    <script src="lib/howler.min.js"></script>
    
    <!-- 2. Carga las librerías específicas de EGT (¡LAS QUE FALTABAN!) -->
    <script src="lib/gamy.min.js"></script>
    <script src="lib/egt-library.min.js"></script>
    
    <!-- 3. Carga otros plugins y utilidades -->
    <script src="lib/bottle.min.js"></script>
    <script src="lib/CustomEase.min.js"></script>
    <script src="lib/Physics2DPlugin.min.js"></script>

    <!-- 4. Carga los scripts del juego -->
    <script src="scripts/Config.js"></script>
    <script src="scripts/BonusAnimation.min.js"></script>
    <script src="scripts/FreespinAnimation.min.js"></script>
    <script src="scripts/Game.min.js"></script>
    
    <!-- 5. Carga el archivo de configuración final y el main -->
    <script src="Config.js"></script>
    <script src="main.js"></script>
</body>
</html>
